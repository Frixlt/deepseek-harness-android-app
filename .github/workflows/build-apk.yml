name: build-apk (manual)

# B6：只支持**手动触发**（workflow_dispatch）——刻意不加 push / pull_request 触发器，
# 避免每次提交都跑一遍十几分钟的完整构建。用途是"按需产出可核对哈希的构建物"。
#
# 来源信号约定：社区密钥（android-app/community.jks）是公开的，因此"谁签的"不再等于"谁发的"；
# 真正的凭据是 —— ① 本 workflow 公开跑、输入可核对（commit + 上游 tag/md5 + JDK/build-tools 版本）；
# ② 产物 SHA-256 与 .build-info.txt 一并上传。目标是"输入可验证 + 哈希公示 + 差异可解释"，
# **不追求逐字节可复现**（aapt/签名含时间戳，Android 打包链做不到 bit-identical）。
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      original_look:
        description: 'Оригинальный дизайн синего кита (--original-look)'
        required: false
        default: false
        type: boolean
      emulator:
        description: 'Сборка для эмулятора x86_64 (--emulator)'
        required: false
        default: false
        type: boolean
      publish_release:
        description: 'Опубликовать релиз на GitHub (Publish as GitHub Release)'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Имя тега для релиза (Release tag name)'
        required: false
        default: 'v1.21.2-localized'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK（只要 build-tools + 任一 platform，不需要 Gradle/AGP）
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-36'

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.original_look }}" = "true" ]; then ARGS="$ARGS --original-look"; fi
          if [ "${{ inputs.emulator }}" = "true" ]; then ARGS="$ARGS --emulator"; fi
          bash tools/build-apk.sh $ARGS
          echo "apk=$(ls -1 android-app/DeepSeekHarness*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Show hash
        run: |
          echo "== 产物 =="
          ls -l android-app/DeepSeekHarness*.apk* android-app/*.build-info.txt 2>/dev/null || true
          for f in android-app/DeepSeekHarness*.apk; do
            echo "$(sha256sum "$f")"
          done
          cat android-app/DeepSeekHarness*.apk.build-info.txt 2>/dev/null || true

      - name: Upload APK + hash + build info
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            android-app/DeepSeekHarness*.apk
            android-app/DeepSeekHarness*.apk.sha256
            android-app/DeepSeekHarness*.apk.build-info.txt

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.21.2-localized' }}
          name: ${{ inputs.release_tag || 'v1.21.2-localized' }} (Full EN/RU Localization)
          body: |
            ## DeepSeek Harness Android (Community Fork) — Полная русская и английская локализация

            ### Основные изменения / Highlights:
            - 🌐 **Полная русская и английская локализация (Full RU/EN/ZH Localization)**:
              - Поддержка автоопределения языка системы (`ru` / `en` / `zh`).
              - Мгновенный переключатель языка в консоли управления (`Auto`, `Русский`, `English`, `中文`).
              - 100% ручная вычитка интерфейса, диалогов, онбординга, подсказок и плавающего ассистента.
              - Переведены службы `EngineService`, `OverlayService`, `AccessibilityService`, `VsreenBridgeService`, плагин `ds-harness-remote` и системные уведомления.
            - 📱 **Готовый APK для установки на устройства**:
              - Установите APK и запустите. При первом запуске среда распакуется автоматически (1–3 минуты).
          draft: false
          prerelease: false
          files: |
            android-app/DeepSeekHarness*.apk
            android-app/DeepSeekHarness*.apk.sha256
            android-app/DeepSeekHarness*.apk.build-info.txt
