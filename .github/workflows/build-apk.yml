name: Build and release APK

# Community signing identity is public; retain source SHA and build/hash sidecars.
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      original_look:
        description: 'Оригинальный дизайн синего кита (--original-look)'
        required: false
        default: false
        type: boolean
      emulator:
        description: 'Сборка для эмулятора x86_64 (--emulator)'
        required: false
        default: false
        type: boolean
      publish_release:
        description: 'Опубликовать релиз на GitHub (Publish as GitHub Release)'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Тег релиза (пусто = v<versionName>-community)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Avatar regression checks
        run: |
          javac -d "$RUNNER_TEMP/avatar-state" android-app/src/com/deepseek/harness/AvatarState.java tools/tests/AvatarStateTest.java
          java -cp "$RUNNER_TEMP/avatar-state" com.deepseek.harness.AvatarStateTest
          node tools/tests/overlay-events.cjs
          node tools/tests/avatar-rendering.cjs

      - name: Release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYMETA'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          version = ET.parse('android-app/AndroidManifest.xml').getroot().get('{http://schemas.android.com/apk/res/android}versionName')
          notes = Path('docs/releases') / (version + '.md')
          if not notes.is_file():
              raise SystemExit('Missing release changelog: ' + str(notes))
          tag = os.environ.get('RELEASE_TAG') or 'v' + version + '-community'
          if any(c.isspace() for c in tag):
              raise SystemExit('Release tag must not contain whitespace')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=' + tag + '\nnotes=' + str(notes) + '\n')
          PYMETA

      - name: Set up Android SDK（只要 build-tools + 任一 platform，不需要 Gradle/AGP）
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-36'

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.original_look }}" = "true" ]; then ARGS="$ARGS --original-look"; fi
          if [ "${{ inputs.emulator }}" = "true" ]; then ARGS="$ARGS --emulator"; fi
          bash tools/build-apk.sh $ARGS
          echo "apk=$(ls -1 android-app/DeepSeekHarness*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Show hash
        run: |
          echo "== 产物 =="
          ls -l android-app/DeepSeekHarness*.apk* android-app/*.build-info.txt 2>/dev/null || true
          for f in android-app/DeepSeekHarness*.apk; do
            echo "$(sha256sum "$f")"
          done
          cat android-app/DeepSeekHarness*.apk.build-info.txt 2>/dev/null || true

      - name: Upload APK + hash + build info
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            android-app/DeepSeekHarness*.apk
            android-app/DeepSeekHarness*.apk.sha256
            android-app/DeepSeekHarness*.apk.build-info.txt

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          files: |
            android-app/DeepSeekHarness*.apk
            android-app/DeepSeekHarness*.apk.sha256
            android-app/DeepSeekHarness*.apk.build-info.txt
